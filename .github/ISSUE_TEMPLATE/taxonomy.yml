name: Taxonomy or vocabulary mapping
description: Propose a mapping of a class to another vocabulary, or a change to the taxonomy.
title: "[taxonomy] "
labels: ["taxonomy"]
body:
  - type: markdown
    attributes:
      value: |
        The 69 classes and their definitions are in `modes/taxonomy/classes.csv`; mappings to other vocabularies are in
        `modes/taxonomy/correspondence.csv`. A new mapping that cites its source is checked against that source and
        added in a MINOR release. A new class or a changed definition changes how papers are coded, so it is discussed
        here and decided by the maintainer; an incompatible change starts a new MAJOR version.
  - type: dropdown
    id: kind
    attributes:
      label: Proposal
      options:
        - Mapping of a class to another vocabulary
        - New class
        - Change to a class definition
        - Other
    validations:
      required: true
  - type: input
    id: class
    attributes:
      label: Class
      description: Class kind and name, as in `classes.csv`.
      placeholder: "module_type / flow_reactor"
    validations:
      required: true
  - type: input
    id: vocabulary
    attributes:
      label: Other vocabulary and term (for a mapping)
      placeholder: "XDL / ..."
  - type: dropdown
    id: relation_type
    attributes:
      label: Relation (for a mapping)
      description: "exact: the same concept; broader: the other term is wider than this class; narrower: the other term is narrower; none: the vocabulary has no counterpart."
      options:
        - exact
        - broader
        - narrower
        - none
  - type: input
    id: source
    attributes:
      label: Source with page
      description: The publication that defines the other term, with page and figure, table or section.
      placeholder: "Leong et al., Matter 5, 3124 (2022), p. 4, Table 1"
  - type: textarea
    id: rationale
    attributes:
      label: Rationale
      description: For a new class or a changed definition, give examples of coded items it would change (item ids).
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Name and ORCID for credit (optional)
      description: Accepted contributors are listed in CONTRIBUTORS.md and as contributors on the Zenodo record. Leave empty to be credited by GitHub handle only.
      placeholder: "Jane Doe, https://orcid.org/0000-0000-0000-0000"
  - type: checkboxes
    id: terms
    attributes:
      label: Licence
      options:
        - label: I agree that this contribution is published under CC BY 4.0, the licence of the dataset.
          required: true
